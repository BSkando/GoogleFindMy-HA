name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least-privilege default for every job (CodeQL actions/missing-workflow-permissions).
# Jobs that need more declare it themselves.
permissions:
  contents: read

# One live CI run per pull request: a push that starts a new run supersedes the
# previous run, including one that still waits for approval. Push runs on main
# get a unique group (run_id), so they never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Pull request runs pass the job approval_gate, bound to the environment
  # "home-assistant-tests", before any other job of this workflow starts.
  # Where that environment has a required reviewer
  # (jleinenbach/GoogleFindMy-HA), the run waits for a manual approval, so
  # the Home Assistant test load only happens when it is wanted. Where it has
  # no protection rules (GitHub creates a missing environment without rules
  # on the first run that references it), the gate passes without waiting
  # for approval. Other pull request workflows are not gated (AGENTS.md).
  # Pushes to main run without the gate. Guarded by
  # tests/test_ci_approval_gate.py.
  approval_gate:
    name: CI approval gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: home-assistant-tests
    permissions: {}
    steps:
      - name: Record approval
        run: echo "CI run approved in environment home-assistant-tests."

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: approval_gate
    # Every job states its condition explicitly: a skipped gate (push) must
    # not skip the jobs that depend on hassfest, and on a pull request only
    # an approved gate lets anything run.
    if: ${{ !cancelled() && (needs.approval_gate.result == 'success' || (github.event_name == 'push' && needs.approval_gate.result == 'skipped')) }}
    # checks: read is the documented permission for /commits/{sha}/check-runs
    # (GitHub REST, "List check runs for a Git reference"), which the auto-fix
    # detection below reads twice: the inline query and
    # lewagon/wait-on-check-action. The inline query tolerates an API error by
    # assuming no auto-fix run exists (found=false), so the guard must not rely
    # on public-repo tolerance for an unprivileged token.
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}


      - name: Detect hassfest auto-fix check
        id: hassfest_autofix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ.get("GITHUB_TOKEN")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{target_sha}/check-runs"
          )
          request.add_header("Accept", "application/vnd.github+json")
          if token:
              request.add_header("Authorization", f"Bearer {token}")

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:  # pragma: no cover - network error surface
              print(f"Warning: unable to query check runs (status={exc.code}). Assuming none present.")
              payload = {"check_runs": []}
          except urllib.error.URLError as exc:  # pragma: no cover - network error surface
              print(f"Warning: unable to reach GitHub API ({exc}). Assuming no matching checks.")
              payload = {"check_runs": []}

          pattern = re.compile(r"(?i)^hassfest( \(auto-fix\)( / hassfest.*)?)?$")
          has_match = any(
              pattern.search(run.get("name", ""))
              for run in payload.get("check_runs", [])
          )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"found={'true' if has_match else 'false'}\n")

          print(
              "Detected hassfest (auto-fix) check: {}".format(
                  "yes" if has_match else "no"
              )
          )
          PY

      - name: Wait for hassfest auto-fix workflow to finish
        if: steps.hassfest_autofix.outputs.found == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: '^[Hh]assfest( \(auto-fix\)( / hassfest.*)?)?$'
          allowed-conclusions: 'success,failure,neutral'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Run hassfest
        id: hassfest
        # Tracks the upstream branch on purpose (no maintained release tag); see AGENTS.md, Action pinning.
        uses: home-assistant/actions/hassfest@master

      - name: Write hassfest summary
        if: always()
        run: |
          {
            echo "## Hassfest Validation"
            echo ""
            if [ "${{ steps.hassfest.outcome }}" = "success" ]; then
              echo "✅ **Manifest validation passed**"
              echo ""
              echo "The \`manifest.json\` and integration structure are valid."
            else
              echo "❌ **Manifest validation failed**"
              echo ""
              echo "Check the logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hassfest
    if: ${{ !cancelled() && needs.hassfest.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}


      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # No brands CDN probe: the HACS brands check reads the local
      # custom_components/googlefindmy/brand/icon.png and only falls back to
      # brands.home-assistant.io when that file is missing, which
      # tests/test_brand_assets.py rules out.
      - name: Run HACS validation
        id: hacs
        continue-on-error: true
        # Tracks the upstream branch on purpose (no maintained release tag); see AGENTS.md, Action pinning.
        uses: hacs/action@main
        with:
          category: integration

      # Transient HACS regression guard (hacs/integration#5252): the action
      # intermittently fetches the raw hacs.json / manifest.json as None from
      # the GitHub contents API and reports "invalid 'hacs.json' file" and
      # "integration_manifest ... Got None" on byte-identical, valid files.
      # If the first run fails, re-run with exactly those two transient-prone
      # validators isolated. If everything else passes, the failure was the
      # known transient signature and is tolerated (job stays green with a
      # warning). The isolation is NOT permanent: it only runs on failure, so a
      # healthy HACS still exercises all checks. The real validity of both files
      # is still enforced independently at the ci-success level: manifest.json by
      # the hassfest job (this job needs: hassfest) and hacs.json by the test job
      # (tests/test_hacs_validation.py). Any other failing check keeps this red.
      - name: Re-run HACS validation (isolate transient checks)
        if: steps.hacs.outcome == 'failure'
        id: hacs_surgical
        continue-on-error: true
        # Tracks the upstream branch on purpose (no maintained release tag); see AGENTS.md, Action pinning.
        uses: hacs/action@main
        with:
          category: integration
          ignore: hacsjson integration_manifest

      - name: Classify HACS result
        id: hacs_verdict
        env:
          FIRST: ${{ steps.hacs.outcome }}
          RETRY: ${{ steps.hacs_surgical.outcome }}
        run: |
          set -u
          if [ "$FIRST" = "success" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          elif [ "$RETRY" = "success" ]; then
            echo "::warning ::HACS validation failed only on the transient-prone checks (hacsjson, integration_manifest) and passed once they were isolated; treating as the known transient upstream regression (hacs/integration#5252). File validity is still enforced by the hassfest and test jobs."
            echo "status=transient" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::HACS validation failed on a check beyond the known transient signature; treating as a real defect."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write HACS summary
        if: always()
        run: |
          {
            echo "## HACS Validation"
            echo ""
            if [ "${{ steps.hacs_verdict.outputs.status }}" = "passed" ]; then
              echo "✅ **HACS validation passed**"
              echo ""
              echo "The integration meets HACS requirements."
            elif [ "${{ steps.hacs_verdict.outputs.status }}" = "transient" ]; then
              echo "⚠️ **HACS validation passed after isolating transient checks** - tolerated upstream regression (hacs/integration#5252)."
              echo ""
              echo "Only hacsjson/integration_manifest failed; file validity is enforced by the hassfest and test jobs."
            else
              echo "❌ **HACS validation failed**"
              echo ""
              echo "Check the logs above for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  translations:
    name: Translations validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: hassfest
    if: ${{ !cancelled() && needs.hassfest.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Run translations sync check
        id: translations_sync
        run: python script/sync_translations.py --check

      - name: Run translation key coverage check
        id: translation_keys
        run: python script/translation_key_check.py

      - name: Run translation placeholder symmetry check
        id: translation_placeholders
        run: python script/translation_placeholder_check.py --github

      - name: Write translations summary
        if: always()
        run: |
          {
            echo "## Translations Validation"
            echo ""
            if [ "${{ steps.translations_sync.outcome }}" = "success" ] \
              && [ "${{ steps.translation_keys.outcome }}" = "success" ] \
              && [ "${{ steps.translation_placeholders.outcome }}" = "success" ]; then
              echo "✅ **All translation gates passed**"
              echo ""
              echo "* ``sync_translations.py --check`` (locales aligned with strings.json)"
              echo "* ``translation_key_check.py`` (no missing keys per locale)"
              echo "* ``translation_placeholder_check.py`` (issue placeholders match code)"
            else
              echo "❌ **Translation drift detected**"
              echo ""
              echo "| Gate | Result |"
              echo "| --- | --- |"
              echo "| sync_translations | ${{ steps.translations_sync.outcome }} |"
              echo "| translation_keys | ${{ steps.translation_keys.outcome }} |"
              echo "| translation_placeholders | ${{ steps.translation_placeholders.outcome }} |"
              echo ""
              echo "See the failing step above for the affected keys."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  vendored_assets:
    name: Vendored assets freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: hassfest
    if: ${{ !cancelled() && needs.hassfest.result == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Dependabot reads manifests, never checked-in files. Without this gate a
      # bump of the `leaflet` devDependency would leave the embedded copy behind
      # and nothing would go red. No network and no Node needed: the check
      # compares package.json against vendor/leaflet/VERSION and the recorded
      # digests against the files themselves.
      - name: Check the vendored Leaflet copy
        id: vendor_leaflet
        run: python script/vendor_leaflet.py --check

      - name: Write vendored assets summary
        if: always()
        run: |
          {
            echo "## Vendored assets"
            echo ""
            if [ "${{ steps.vendor_leaflet.outcome }}" = "success" ]; then
              echo "✅ **Leaflet copy matches the pinned version and its digests**"
            else
              echo "❌ **Vendored Leaflet is out of step**"
              echo ""
              echo "Run \`npm install && python script/vendor_leaflet.py\` and commit the result."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hassfest
    if: ${{ !cancelled() && needs.hassfest.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, codespell, bandit, pre-commit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      # The Python version belongs in both the key and the restore prefix. The
      # cached artefact is a complete virtualenv, so an interpreter-agnostic
      # prefix can restore a 3.13 `.venv` built before the lock moved to
      # `^3.14.2`; Poetry then adopts that interpreter as the project
      # environment and `poetry install` refuses it, taking all four lint jobs
      # down before they run. The `test` job already keys this way.
      - name: Cache Poetry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-py3.14-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py3.14-poetry-

      - name: Cache pre-commit environments
        if: matrix.check == 'pre-commit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Install dependencies
        run: poetry install --with dev,test

      # Runs every hook of .pre-commit-config.yaml except mypy and pytest, which
      # have jobs of their own, so a broken hook entry turns this check red.
      - name: Run pre-commit
        if: matrix.check == 'pre-commit'
        id: precommit
        run: |
          set +e
          SKIP=pytest,mypy poetry run pre-commit run --all-files --show-diff-on-failure 2>&1 | tee pre-commit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run Ruff
        if: matrix.check == 'ruff'
        id: ruff
        run: |
          set +e
          poetry run ruff check . 2>&1 | tee ruff_output.txt
          CHECK_EXIT=${PIPESTATUS[0]}
          poetry run ruff format --check . 2>&1 | tee -a ruff_output.txt
          FORMAT_EXIT=${PIPESTATUS[0]}
          EXIT_CODE=$(( CHECK_EXIT > FORMAT_EXIT ? CHECK_EXIT : FORMAT_EXIT ))
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run mypy (strict)
        if: matrix.check == 'mypy'
        id: mypy
        run: |
          set +e
          {
            poetry run mypy --install-types --non-interactive --strict -p custom_components.googlefindmy
            poetry run mypy --install-types --non-interactive --strict -p tests
          } 2>&1 | tee mypy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run codespell
        if: matrix.check == 'codespell'
        id: codespell
        continue-on-error: true  # Non-blocking - informational only
        run: |
          set +e
          poetry run codespell 2>&1 | tee codespell_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Run bandit (security)
        if: matrix.check == 'bandit'
        id: bandit
        run: |
          set +e
          # Run bandit security scanner on custom_components only; tests/ is not a target (and is listed in exclude_dirs)
          # Exclude known false positives and test files that intentionally test security
          poetry run bandit -r custom_components -c pyproject.toml -f txt 2>&1 | tee bandit_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Write lint summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.check }} Results"
            echo ""
            if [ "${{ matrix.check }}" = "ruff" ]; then
              if [ -f ruff_output.txt ]; then
                ISSUES=$(grep -c "^" ruff_output.txt 2>/dev/null || echo "0")
                if [ "$ISSUES" = "0" ] || [ ! -s ruff_output.txt ]; then
                  echo "✅ **No issues found**"
                else
                  echo "❌ **Issues found:**"
                  echo ""
                  echo '```'
                  head -100 ruff_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "mypy" ]; then
              if [ -f mypy_output.txt ]; then
                ERRORS=$(grep -c "error:" mypy_output.txt 2>/dev/null || echo "0")
                if [ "$ERRORS" = "0" ]; then
                  echo "✅ **No type errors found**"
                else
                  echo "❌ **$ERRORS type error(s) found:**"
                  echo ""
                  echo '```'
                  head -100 mypy_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "codespell" ]; then
              if [ -f codespell_output.txt ]; then
                if [ ! -s codespell_output.txt ]; then
                  echo "✅ **No spelling errors found**"
                else
                  echo "ℹ️ **Spelling suggestions (non-blocking):**"
                  echo ""
                  echo "These are informational only. Add a false positive to \`pyproject.toml\` ignore-words-list when the reports it causes outweigh the detection lost tree-wide (see \`AGENTS.md\`)."
                  echo ""
                  echo '```'
                  cat codespell_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "pre-commit" ]; then
              if [ -f pre-commit_output.txt ]; then
                if [ "${{ steps.precommit.outputs.exit_code }}" = "0" ]; then
                  echo "✅ **All hooks passed** (mypy and pytest run in their own jobs)"
                else
                  echo "❌ **A hook failed or rewrote files:**"
                  echo ""
                  echo '```'
                  tail -100 pre-commit_output.txt
                  echo '```'
                fi
              fi
            elif [ "${{ matrix.check }}" = "bandit" ]; then
              if [ -f bandit_output.txt ]; then
                ISSUES=$(grep -c "Issue:" bandit_output.txt 2>/dev/null || echo "0")
                if [ "$ISSUES" = "0" ]; then
                  echo "✅ **No security issues found**"
                else
                  echo "⚠️ **$ISSUES potential security issue(s) found:**"
                  echo ""
                  echo '```'
                  cat bandit_output.txt
                  echo '```'
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - hassfest
      - hacs
    if: ${{ !cancelled() && needs.hassfest.result == 'success' && needs.hacs.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant requires Python >=3.14.2 from Core 2026.3.0 onwards, so
        # the Poetry lock resolves the dev/test tree only for 3.14+. Python 3.13
        # is still what users on Core <=2026.2.x run; that axis is covered by the
        # lock-free `test_legacy_python` job below, not by this matrix.
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-poetry-

      - name: Install system dependencies
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          poetry run pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=80 2>&1 | tee pytest_output.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Write short summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Pytest summary (Python ${{ matrix.python-version }})"
            echo
            echo '```'
            tail -n 200 pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test_legacy_python:
    name: Test (Python 3.13, ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - hassfest
      - hacs
    if: ${{ !cancelled() && needs.hassfest.result == 'success' && needs.hacs.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor hacs.json actually declares. The stub constraints in the
          # repository pin the poetry.lock release (2026.10.3, Python 3.14 only),
          # which is a speed-up for local runs and not a compatibility claim;
          # testing there would leave the pre-2025.11
          # paths -- such as the `EntityCategory` import fallback in button.py --
          # unexercised by every axis. 0.13.278 is the plugin release that
          # carries Home Assistant 2025.9.1. `floor` marks the axis that is
          # checked against hacs.json and that needs the `pycares<5` cap.
          - label: "declared floor"
            ha_pin: "2025.9.1"
            plugin_pin: "0.13.278"
            floor: true
          # The last Home Assistant release that still supports Python 3.13:
          # 2026.3.0 requires Python 3.14.2, so this pin is final. 0.13.316 is
          # the last plugin release for Python 3.13 and requires exactly
          # 2026.2.3. Left unpinned, pip's backtracking resolver settled on an
          # older set instead (Home Assistant 2026.1.3, and 2025.10.4 once the
          # pytest-asyncio pin was dropped), and the run still passed.
          - label: "last 3.13 line"
            ha_pin: "2026.2.3"
            plugin_pin: "0.13.316"
            floor: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      # Deliberately lock-free: poetry.lock resolves the dev/test tree for
      # Python >=3.14.2 only, because Home Assistant Core requires 3.14.2 from
      # 2026.3.0 onwards. Installing from the plain requirement files keeps the
      # Python 3.13 axis under test, which is what users on Core 2025.9.1
      # through 2026.2.x run and where the backwards-compatibility shims fire.
      # Guards against silent drift: if someone raises the floor in hacs.json,
      # this axis would keep testing the old one and the label would lie.
      - name: Verify the pinned floor still matches hacs.json
        if: matrix.floor
        run: |
          set -euo pipefail
          declared="$(python -c 'import json;print(json.load(open("hacs.json"))["homeassistant"])')"
          if [ "$declared" != "${{ matrix.ha_pin }}" ]; then
            echo "::error::hacs.json declares Home Assistant $declared but this axis pins ${{ matrix.ha_pin }}. Update the matrix entry (and the pytest plugin release that carries it)."
            exit 1
          fi
          echo "hacs.json floor: $declared"

      - name: Rewrite the stub constraints for this axis
        run: |
          set -euo pipefail
          if [ -z "${{ matrix.ha_pin }}" ] || [ -z "${{ matrix.plugin_pin }}" ]; then
            echo "::error::Every axis must pin both homeassistant and pytest-homeassistant-custom-component; an unpinned axis tests whatever pip happens to resolve."
            exit 1
          fi
          constraints=custom_components/googlefindmy/constraints-test-stubs.txt
          sed -i -E '/^(homeassistant|pytest-homeassistant-custom-component)==/d' "$constraints"
          # The plugin release that carries an older Home Assistant also
          # carries the pytest stack of its own era and pins it exactly:
          # 0.13.278 requires pytest-asyncio==1.1.0 and 0.13.316 requires
          # 1.3.0, while requirements-dev.txt pins the poetry.lock version
          # (1.4.0). Keeping both makes the resolution impossible, so the local
          # pin steps aside on every axis and the plugin pin decides.
          sed -i -E '/^pytest-asyncio==/d' \
            custom_components/googlefindmy/requirements-dev.txt
          # Home Assistant 2025.9.1 pulls aiodns 3.5.0, which annotates with
          # pycares 4 result types but sets no upper bound on pycares, so the
          # floor axis caps it. The other axis must not: 2026.2.3 requires
          # aiodns==4.0.0, which requires pycares>=5, as does the poetry.lock
          # release in the repository file.
          if [ "${{ matrix.floor }}" = "true" ]; then
            printf 'pycares<5\n' >> "$constraints"
          fi
          printf 'homeassistant==%s\n' "${{ matrix.ha_pin }}" >> "$constraints"
          printf 'pytest-homeassistant-custom-component==%s\n' "${{ matrix.plugin_pin }}" >> "$constraints"
          echo "Constraints for this axis:"
          cat "$constraints"

      - name: Install dependencies without the Poetry lock
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/googlefindmy/requirements-dev.txt

      # Printed, and asserted, so this job's claim about which Home Assistant
      # release it exercised is measured rather than inferred from the matrix
      # label. A passing run only proves that the dependencies installed; this
      # step proves that they are the ones the axis is named after.
      - name: Report and verify the resolved Home Assistant and plugin versions
        run: |
          set -euo pipefail
          resolved="$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')"
          plugin="$(python -c 'from importlib.metadata import version; print(version("pytest-homeassistant-custom-component"))')"
          echo "homeassistant==${resolved}"
          echo "pytest-homeassistant-custom-component==${plugin}"
          if [ "${resolved}" != "${{ matrix.ha_pin }}" ]; then
            echo "::error::The ${{ matrix.label }} axis resolved Home Assistant ${resolved}, not the pinned '${{ matrix.ha_pin }}'."
            exit 1
          fi
          if [ "${plugin}" != "${{ matrix.plugin_pin }}" ]; then
            echo "::error::The ${{ matrix.label }} axis resolved pytest-homeassistant-custom-component ${plugin}, not the pinned '${{ matrix.plugin_pin }}'."
            exit 1
          fi

      # No coverage gate here: coverage is measured once, by the `test` job on
      # the primary axis. This job answers a single question, namely whether
      # the suite still passes on Python 3.13 against the last Home Assistant
      # line that supports it.
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q --no-cov 2>&1 | tee pytest_legacy_output.log

      - name: Write short summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "## Pytest summary (Python 3.13, ${{ matrix.label }})"
            echo
            echo '```'
            tail -n 200 pytest_legacy_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Summary job to require all tests pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [approval_gate, hassfest, hacs, lint, test, test_legacy_python, translations, vendored_assets]
    if: always()
    steps:
      - name: Check all jobs passed
        id: check
        # Pinned so a workflow-level defaults.run.shell cannot switch the check to
        # sh, where [[ is not found and both checks fall through to success.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GATE: ${{ needs.approval_gate.result }}
        run: |
          # Second lock: a pull request run only passes with an approved gate.
          if [[ "$EVENT" == "pull_request" && "$GATE" != "success" ]]; then
            echo "CI approval gate not approved (result: $GATE)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "${{ needs.hassfest.result }}" != "success" ]] || \
             [[ "${{ needs.hacs.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test_legacy_python.result }}" != "success" ]] || \
             [[ "${{ needs.translations.result }}" != "success" ]] || \
             [[ "${{ needs.vendored_assets.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All CI jobs passed!"
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "# CI Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"

            if [ "${{ needs.approval_gate.result }}" = "success" ]; then
              echo "| Approval gate | ✅ Approved |"
            elif [ "${{ needs.approval_gate.result }}" = "skipped" ]; then
              echo "| Approval gate | ⏭️ Not required (push) |"
            else
              echo "| Approval gate | ❌ ${{ needs.approval_gate.result }} |"
            fi

            if [ "${{ needs.hassfest.result }}" = "success" ]; then
              echo "| Hassfest | ✅ Pass |"
            else
              echo "| Hassfest | ❌ Fail |"
            fi

            if [ "${{ needs.hacs.result }}" = "success" ]; then
              echo "| HACS | ✅ Pass |"
            else
              echo "| HACS | ❌ Fail |"
            fi

            if [ "${{ needs.vendored_assets.result }}" = "success" ]; then
              echo "| Vendored assets | ✅ Pass |"
            else
              echo "| Vendored assets | ❌ Fail |"
            fi

            if [ "${{ needs.lint.result }}" = "success" ]; then
              echo "| Lint (ruff, mypy, codespell, bandit, pre-commit) | ✅ Pass |"
            else
              echo "| Lint (ruff, mypy, codespell, bandit, pre-commit) | ❌ Fail |"
            fi

            if [ "${{ needs.test.result }}" = "success" ]; then
              echo "| Tests | ✅ Pass |"
            else
              echo "| Tests | ❌ Fail |"
            fi

            if [ "${{ needs.test_legacy_python.result }}" = "success" ]; then
              echo "| Tests (Python 3.13, legacy HA) | ✅ Pass |"
            else
              echo "| Tests (Python 3.13, legacy HA) | ❌ Fail |"
            fi

            if [ "${{ needs.translations.result }}" = "success" ]; then
              echo "| Translations | ✅ Pass |"
            else
              echo "| Translations | ❌ Fail |"
            fi

            echo ""
            if [ "${{ steps.check.outputs.passed }}" = "true" ]; then
              echo "## ✅ All checks passed!"
            else
              echo "## ❌ Some checks failed"
              echo ""
              echo "Please review the failed jobs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
