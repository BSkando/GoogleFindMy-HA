name: Release

on:
  # Workflow A of the "manual release -> code stamp" handshake.
  #
  # Triggered manually via the Actions UI ("Run workflow"), which lets you pick
  # the branch (main or any X.Y maintenance line) at run time -- no branch name
  # is hard-wired here. It only PROPOSES the next version and opens a DRAFT
  # release; it never stamps code, tags, or publishes. semantic-release derives
  # the proposed version from git tags plus the Conventional Commits since the
  # last tag, never from the branch name (see pyproject.toml [tool.semantic_release]).
  #
  # The maintainer then edits the draft (tag and/or body) and publishes it. That
  # publish fires release-stamp.yml (Workflow B), which writes the exact chosen
  # tag into the three version literals. Nothing releases automatically.
  #
  # Workflow B first checks the published tag: it refuses a four-segment or
  # `v`-prefixed version and any number not greater than every tag of the
  # repository. A draft on an older X.Y maintenance line, or with a hand-picked
  # four-segment tag, can still be opened here, but publishing it ends in a
  # refused stamp and a release without googlefindmy.zip, which has to be
  # deleted. There is no switch for a deliberate exception; it needs a change
  # of that step in release-stamp.yml.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preview only, do not create a draft)"
        required: false
        default: "false"
        type: boolean

# Least-privilege: contents:write is all that "gh release create --draft" and
# the dry-run preview need. Publishing / PR work happens in release-stamp.yml.
permissions:
  contents: write

jobs:
  release:
    name: Propose version and open draft release
    runs-on: ubuntu-latest
    # Only run on the maintainer forks, not on downstream forks.
    if: github.repository_owner == 'jleinenbach' || github.repository_owner == 'BSkando'
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only dev

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preview (dry run)
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Global --noop MUST precede the subcommand in python-semantic-release
          # v10 (`version --noop` / `changelog --noop` are not valid options).
          # PSR logs one WARNING per tag it cannot parse (four-segment, beta and
          # foreign tags) on stderr. They are folded into one count line per call;
          # every other stderr line and all of stdout stay visible. Layer 1: a wide
          # COLUMNS stops rich from wrapping a record. Layer 2: rich indents the
          # continuation lines of a wrapped record by 20 columns; those that follow
          # a folded record are dropped with it, so a console narrowed down to rich's
          # 80-column default cannot leak them.
          # Locked by tests/test_release_preview_step.py.
          export COLUMNS=1000
          PSR_ERR="$(mktemp "${RUNNER_TEMP:-/tmp}/psr-preview.XXXXXX")" || {
            echo "::error::mktemp for the semantic-release stderr capture failed; nothing was previewed."
            exit 1
          }
          PARSE_WARNING="Couldn't parse tag"
          psr_preview() {
            local rc=0 grep_rc=0 folded
            poetry run semantic-release --noop "$1" 2>"$PSR_ERR" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::'poetry run semantic-release --noop $1' failed with exit code $rc. Its unfiltered stderr follows:"
              cat "$PSR_ERR"
              exit "$rc"
            fi
            folded="$(grep -cF -- "$PARSE_WARNING" "$PSR_ERR")" || grep_rc=$?
            if [ "$grep_rc" -gt 1 ]; then
              echo "::error::counting the folded tag warnings failed (grep exit $grep_rc); nothing was folded."
              exit 1
            fi
            awk -v warning="$PARSE_WARNING" -v indent="$(printf '%20s' '')" '
              index($0, warning) { folding = 1; next }
              folding && index($0, indent) == 1 { next }
              { folding = 0; print }
            ' "$PSR_ERR" >&2 || {
              echo "::error::filtering the semantic-release stderr failed (awk exit $?); its unfiltered stderr follows:"
              cat "$PSR_ERR"
              exit 1
            }
            echo "semantic-release --noop $1: ${folded} unparseable tag warning(s) folded"
          }
          psr_preview version
          psr_preview changelog

      - name: Propose a version and open a draft release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The branch this workflow was dispatched on (main or an X.Y line).
          # Passed via env indirection and used only as the draft's --target so
          # the eventual tag lands on THIS line, never as a hard-wired decision.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # --- Can semantic-release propose for THIS line? --------------------
          # semantic-release only understands SemVer. This project's older
          # maintenance lines were tagged PEP 440 (beta `bN`, four-segment `.N`;
          # release-stamp.yml now refuses a new four-segment tag and a release
          # not greater than the newest tag), which PSR
          # silently skips -- so on those lines its "last release" view drifts
          # from the real newest tag and any proposal derives from a stale base.
          # Detect that branch-name-agnostically by comparing PSR's view with the
          # real topological line tip. Fail-safe: on a false mismatch the
          # maintainer just hand-tags; no wrong number is ever proposed/stamped.
          # `|| true` turns every failure of `git describe` into an empty
          # REAL_TIP, which routes to `propose` below. The expected failure is
          # exit 128 when no tag is reachable (a first release); any other
          # failure takes the same route.
          REAL_TIP="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          # Strip an optional single leading `v` (BSkando tags `vX.Y.Z`,
          # jleinenbach `X.Y.Z[.N]`) so a genuine `v`-prefixed line tip is
          # recognised as a version below rather than blanked as foreign.
          REAL_TIP="${REAL_TIP#v}"
          # Gate REAL_TIP against the canonical PEP 440 version shape (SSOT:
          # script/stamp_version.py VERSION_RE, byte-mirrored in release-stamp.yml).
          # A foreign, non-version tag (e.g. `set-release-tag`, `nightly`, `v2`
          # -> `2` after the v-strip) is not a valid line tip: it must NOT poison
          # the PSR_LAST != REAL_TIP comparison below and spuriously route to the
          # hand-tag draft. PEP 440 beta/four-segment tags DO match VERSION_RE, so
          # they are kept and still trigger MODE=hand on a real stale-base
          # mismatch -- the intended guard.
          if [ -n "$REAL_TIP" ] && ! printf '%s' "$REAL_TIP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([ab][0-9]+)?$'; then
            echo "::notice::ignoring non-PEP-440 line tip '${REAL_TIP}' for PSR routing (not a version tag)."
            REAL_TIP=""
          fi
          # --- Ask semantic-release: a crash is NOT "nothing to propose" ------
          # rc 0 is always an answer, even an empty one (no release tag yet, or a
          # branch outside [tool.semantic_release.branches]). rc != 0 is a crash,
          # a CLI usage error (e.g. an option renamed by a dependency bump) or a
          # refusal such as a detached HEAD (a dispatch on a tag ref), and fails
          # this step with the captured stderr. stderr stays out of the log on
          # success: PSR always emits warning noise there (foreign tags etc.).
          PSR_ERR="$(mktemp "${RUNNER_TEMP:-/tmp}/psr-stderr.XXXXXX")" || {
            echo "::error::mktemp for the semantic-release stderr capture failed; nothing was drafted."
            exit 1
          }
          psr_crashed() {
            echo "::error::'poetry run semantic-release version $1' failed with exit code $2 (a semantic-release crash, usage error or refusal such as a detached HEAD, or poetry failing to start it), NOT 'no release due'; nothing was drafted. Its stderr follows:"
            cat "$PSR_ERR"
            exit "$2"
          }
          PSR_RC=0
          PSR_LAST="$(poetry run semantic-release version --print-last-released 2>"$PSR_ERR")" || PSR_RC=$?
          [ "$PSR_RC" -eq 0 ] || psr_crashed --print-last-released "$PSR_RC"

          MODE=propose
          if [ -n "$REAL_TIP" ] && [ "$REAL_TIP" != "$PSR_LAST" ]; then
            # PSR is blind to this line's tag scheme -> hand-tag draft.
            MODE=hand
            echo "::notice::semantic-release cannot propose for ${REF_NAME}: last-release view (${PSR_LAST:-none}) != real tip (${REAL_TIP}). Opening an empty hand-tag draft."
          else
            # --print prints the CURRENT version (not a new one) when no releasing
            # commit exists since the last tag; guard against drafting a stale
            # release for an already-released version.
            PSR_RC=0
            PROPOSED="$(poetry run semantic-release version --print 2>"$PSR_ERR")" || PSR_RC=$?
            [ "$PSR_RC" -eq 0 ] || psr_crashed --print "$PSR_RC"
            if [ -z "$PROPOSED" ]; then
              echo "::notice::semantic-release proposes nothing for ${REF_NAME} (exit 0, empty answer; branch not matched by [tool.semantic_release.branches]?). Nothing to draft."
              exit 0
            fi
            if [ "$PROPOSED" = "$PSR_LAST" ]; then
              echo "::notice::No release due on ${REF_NAME}: no releasing commits since ${PSR_LAST:-the last tag}. Nothing to draft."
              exit 0
            fi
          fi

          # --- Open the draft --------------------------------------------------
          # A DRAFT release's tag is editable in the UI before publishing; the tag
          # is only created when the draft is published, which fires
          # release-stamp.yml (Workflow B) to stamp the code.
          if [ "$MODE" = "propose" ]; then
            echo "Proposed next version: $PROPOSED (target: $REF_NAME)"
            if ! gh release create "$PROPOSED" --draft --target "$REF_NAME" \
                --generate-notes --title "$PROPOSED"; then
              echo "::error::gh release create failed (does a draft/release '$PROPOSED' already exist?)"
              exit 1
            fi
            echo "Draft created for $PROPOSED on $REF_NAME. Edit and publish it to stamp the code."
          else
            # Hand-tag draft: a placeholder tag the maintainer replaces with the
            # intended version (e.g. 1.7.14b1) before publishing. If published
            # unchanged, release-stamp.yml's VERSION_RE guard rejects the
            # placeholder, so a bad stamp can never land.
            PLACEHOLDER="set-release-tag"
            # Collision guard. A transient view error (auth/API) is treated as
            # "absent" and falls through to `gh release create` below, which then
            # surfaces its own error -- safe, never a silent wrong action.
            if gh release view "$PLACEHOLDER" >/dev/null 2>&1; then
              echo "::error::a '$PLACEHOLDER' draft already exists; publish or delete it, then re-run."
              exit 1
            fi
            if ! gh release create "$PLACEHOLDER" --draft --target "$REF_NAME" \
                --generate-notes \
                --title "DRAFT - replace tag with your version (e.g. 1.7.14 or 1.7.14b1) before publishing"; then
              echo "::error::gh release create failed for the hand-tag draft"
              exit 1
            fi
            echo "Empty hand-tag draft created on $REF_NAME. Set the tag to your version and publish to stamp the code."
          fi
