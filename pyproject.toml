[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
# Ruff 0.16 extended the formatter to Python code blocks inside Markdown. That
# reach arrived through a tool upgrade, not through a decision here, and it
# rewrites hand-aligned example code in eight handbooks under docs/ and
# agents/ (for instance the aligned parameter comments in
# docs/PLAY_SOUND_ARCHITECTURE.md). Documentation examples are read by humans
# and are not compiled; keeping the formatter to actual source files keeps the
# guarantee it exists for -- one uniform style in the tree that ships -- without
# reflowing prose artefacts nobody reviewed. Linting Markdown is unaffected.
exclude = ["*.md"]

[tool.pytest.ini_options]
# No -q here on purpose: -q counts up. Every documented invocation already
# supplies its own (`pytest -q` in AGENTS.md and README.md, the Makefile
# targets, both CI jobs, script/local_verify.py), and a second one makes
# pytest drop its summary line, so a red run would show FAILED lines but
# never say how many tests failed. Measured on 2026-09-12: with one -q the
# summary line is printed, with two it is not.
addopts = ["--cov", "--cov-report=term"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Upstream issue in Home Assistant Core: HA inherits from aiohttp.web.Application
    # which aiohttp has deprecated. This cannot be fixed in this project.
    # Remove when HA Core addresses this deprecation.
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant.components.http",
    # Upstream issue in trio: register_random receives a weakref-eligible object
    # that may be GC'd immediately. Cannot be fixed in this project.
    # Remove when trio addresses this (see trio issue tracker).
    "ignore:It looks like `register_random` was passed an object:hypothesis.errors.HypothesisWarning:trio",
]
markers = [
    "hypothesis: Property-based tests using Hypothesis (can be run in isolation with -m hypothesis)",
]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
show_error_codes = true
mypy_path = ["."]
explicit_package_bases = true
strict = true
local_partial_types = true
warn_return_any = true
files = [
    "custom_components/googlefindmy",
]
exclude = "(^custom_components/googlefindmy/ProtoDecoders/|^custom_components/googlefindmy/Auth/firebase_messaging/proto/)"

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["homeassistant", "homeassistant.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "bs4",
    "cmarkgfm",
    "cmarkgfm.*",
    "Cryptodome.*",
    "ecdsa",
    "google.protobuf.unknown_fields",
    "h2",
    "selenium",
    "selenium.*",
    "webdriver_manager",
    "webdriver_manager.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.test_fcm_receiver_guard"]
ignore_errors = false

[tool.coverage.run]
branch = true
source = [
    "custom_components/googlefindmy",
]
omit = [
    "custom_components/googlefindmy/ProtoDecoders/*",
    # Only generated protobuf bindings are omitted. The FCM transport modules
    # (fcmpushclient.py, fcmregister.py) originate from sdb9696/firebase-messaging
    # (MIT) but are forked and maintained in-repo with integration-specific
    # behavior (fatal HTTP classification, credential/decryption recovery) and
    # dedicated regressions in tests/test_fcm*.py, so they stay under coverage.
    "custom_components/googlefindmy/Auth/firebase_messaging/proto/*",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
# Sprint baseline: measured 63.59 % after PR #1072 registry/subentry helpers
# (was 60 in PR #1071 with 64 % headroom). Target remains >= 95 % per
# quality-scale rule test-coverage; this floor only prevents regressions
# while incremental test expansion lands (60 -> 63 -> 70 -> 80 -> 90 -> 95).
# Recalibrated to 67 after forward-porting the stranded Class-A coverage suite:
# local full run measured 68.33 % scoped (3696 passed); floor = floor(68) - 1 Pp
# jitter margin, clamped to [63, CI total]. Three local entity tests error on a
# root-owned .storage path that CI does not hit, so CI total is >= 68.33 %.
# Raised to 69 after the crypto-audit test suite (PR #1111) lifted CI total to
# 69.14 % (measured 2026-06-16); floor tracks the new CI total to lock the gain.
# Raised to 70 with the accuracy_estimated producer-flag suite (PR #1124): the
# new carry_reused_accuracy helper and chokepoint regression tests lift CI total
# past 70 %; floor tracks the new CI total to lock the gain.
# Raised to 71 with the secrets shared_key validation suite (PR #1128): the
# single-key gate, reauth/discovery guard tests and translation-parity tests
# lift CI total to 71.84 %; floor tracks the new total to lock the gain. The
# usual -1 Pp jitter margin is intentionally tightened here (0.84 Pp headroom)
# per maintainer request to hold the floor at 71.
# Raised to 72 per maintainer request to lock in the coverage gained across the
# 1.7 fix series; the floor takes effect on the next pull request (a direct push
# to 1.7 does not run the coverage gate, which is gated on pull_request and push
# to main).
# Raised to 73 per maintainer request to lock in the coverage from the typed
# gpsoauth AuthError classification tests; measured CI total is 73.26 %, so the
# jitter margin is intentionally tightened to 0.26 Pp headroom here.
# Raised to 74 per maintainer request to lock in the Coverage W1 follow-up
# contract tests (token_refresh, google_uploader and the remaining W1 modules);
# measured total is 74.47 %, so ~0.47 Pp headroom here.
# Raised to 75 per maintainer request to lock in the coverage gained from the
# map_view hardening series (non-finite coordinate skip, recorder fallback,
# date-filter clearing and the _plus_code_for defensive-branch tests);
# measured CI total is 75.40 %, so ~0.40 Pp headroom here.
# Raised to 77 per maintainer request to lock in the coverage gained across the
# single-reload-owner series (reload-latch classifier, the two direct reload
# gates and the refused-hand-off dead ends); measured CI total is 77.72 % on
# c7443b47, so ~0.72 Pp headroom here. Keep in step with the CI-side
# --cov-fail-under flag: tests/test_platinum_compliance.py asserts the two
# gates declare the same floor.
# Raised to 78 per maintainer request to lock in the coverage gained across the
# subentry-deletion type-axis series (owner-key ranking, the type guard and the
# frozen-observation regression tests); measured CI total is 78.36 % on
# 04a66fc2, so ~0.36 Pp headroom here.
# Raised to 80 per maintainer request after `if TYPE_CHECKING:` blocks left the
# coverage denominator (#1283); measured CI total is 80.33 % on c972fd34, so
# ~0.33 Pp headroom here.
fail_under = 80
exclude_lines = [
    "if __name__ == \"__main__\":",
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^[ \\t]*raise NotImplementedError\\b",
]

[tool.coverage.paths]
source = [
    "custom_components/googlefindmy",
    "*/site-packages/custom_components/googlefindmy",
]

[tool.pylint.main]
# Exclude auto-generated protobuf files
ignore-patterns = [".*_pb2\\.py$", ".*_pb2_grpc\\.py$"]
# Set max line length
max-line-length = 120

[tool.pylint."messages control"]
# Disable warnings that are intentional design decisions
disable = [
    # Intentional patterns for this codebase:
    "access-member-before-definition",  # E0203 - Mixin pattern uses attrs from main class
    "broad-exception-caught",       # W0718 - Defensive error handling
    "protected-access",             # W0212 - Internal API access
    "import-outside-toplevel",      # C0415 - Lazy loading pattern
    "wrong-import-position",        # C0413 - Conditional imports
    "wrong-import-order",           # C0411 - Handled by ruff isort
    "global-statement",             # W0603 - Module-level state
    "cyclic-import",                # R0401 - Lazy imports handle this
    "unused-argument",              # W0613 - Interface compatibility
    "redefined-outer-name",         # W0621 - Common in callbacks
    "try-except-raise",             # W0706 - Intentional for CancelledError
    "unnecessary-ellipsis",         # W2301 - Protocol class methods
    "no-name-in-module",            # E0611 - Protobuf imports
    "not-callable",                 # E1102 - False positives with Optional
    "attribute-defined-outside-init", # W0201 - HA entity pattern
    "abstract-method",              # W0223 - Partial implementations
    "no-else-return",               # R1705 - Style preference
    # Complexity warnings (code reviewed and acceptable):
    "too-many-arguments",           # R0913
    "too-many-locals",              # R0914
    "too-many-branches",            # R0912
    "too-many-statements",          # R0915
    "too-many-return-statements",   # R0911
    "too-many-nested-blocks",       # R1702
    "too-many-instance-attributes", # R0902
    "too-many-public-methods",      # R0904
    "too-many-lines",               # C0302
    "too-many-ancestors",           # R0901
    # Style preferences:
    "missing-function-docstring",   # C0116 - Not all internal funcs need docs
    "missing-module-docstring",     # C0114 - Not all modules need docs
    "missing-class-docstring",      # C0115 - Not all classes need docs
    "line-too-long",                # C0301 - Handled by ruff
    "duplicate-code",               # R0801 - Some duplication is acceptable
    "too-few-public-methods",       # R0903 - Data classes are fine
    "consider-using-f-string",      # C0209 - Existing % formatting is fine
    "bad-indentation",              # W0311 - Generated pb2 files use 2-space
    "invalid-name",                 # C0103 - Allow short names in math/crypto
    "no-member",                    # E1101 - False positives with dynamic attrs
    "import-error",                 # E0401 - Optional dependencies
    "reimported",                   # W0404 - Conditional imports
    "too-many-positional-arguments", # R0917 - Complex functions
    "singleton-comparison",         # C0121 - Style preference
    "useless-import-alias",         # C0414 - Re-export pattern
    "undefined-all-variable",       # E0603 - Dynamic __all__
    "logging-not-lazy",             # W1201 - Performance not critical here
    "logging-fstring-interpolation", # W1203 - f-strings in logging acceptable
    "useless-return",               # R1711 - Explicit returns for clarity
    "arguments-differ",             # W0221 - Overrides with different signatures
    "ungrouped-imports",            # C0412 - Import order handled by ruff
    "too-many-boolean-expressions", # R0916 - Complex conditions acceptable
    "simplifiable-condition",       # R1726 - Explicit is clearer
    "chained-comparison",           # R1716 - Explicit is clearer
    "no-else-raise",                # R1720 - Style preference
    "no-else-continue",             # R1724 - Style preference
    "consider-iterating-dictionary", # C0201 - Explicit .keys() is clearer
    "unnecessary-lambda-assignment", # C3001 - Lambdas for callbacks
    "unused-import",                # W0611 - Forward compatibility imports
    "duplicate-except",             # W0705 - Intentional for specific handling
    "raise-missing-from",           # W0707 - Handled where needed
    # False positives with dynamic types and Home Assistant APIs:
    "unexpected-keyword-arg",       # E1123 - HA API changes
    "no-value-for-parameter",       # E1120 - Dynamic method signatures
    "too-many-function-args",       # E1121 - HA API changes
    "assignment-from-none",         # E1128 - Optional returns
    "not-an-iterable",              # E1133 - Dynamic types
    "possibly-used-before-assignment", # E0606 - Control flow analysis
    "super-init-not-called",        # W0231 - Abstract base patterns
    "not-async-context-manager",    # E1701 - Optional async context
    "unused-variable",              # W0612 - Intentional placeholder
]

[tool.pylint.design]
# Reasonable limits for complex integration code
max-args = 10
max-locals = 25
max-returns = 10
max-branches = 20
max-statements = 100

[tool.codespell]
skip = ".git,*.lock,*.svg,*.png,*.jpg,*.ico,ProtoDecoders,firebase_messaging,*.pyi,translations,*.proto,*_pb2.py,package-lock.json,./custom_components/googlefindmy/vendor/leaflet,./tests/fixtures"
ignore-words-list = "hass,nd,ot,aas,bund,trough,te,ded,checkin,alpha-numeric,re-declaring,pre-empt,pre-empted,pre-empting,pre-emptive,pre-emptively,pre-empts,titel,unparseable,addressings,re-use,re-uses,re-used,re-using,re-usable"
check-filenames = true

[tool.bandit]
# Exclude auto-generated protobuf files and test files
exclude_dirs = [
    "custom_components/googlefindmy/ProtoDecoders",
    "custom_components/googlefindmy/Auth/firebase_messaging/proto",
    "tests",
    ".venv",
]
# Skip specific checks that are false positives for this codebase
skips = [
    "B101",  # assert_used - Tests use assert; production uses proper checks
    "B105",  # hardcoded_password_string - False positives (form field names)
    "B110",  # try_except_pass - Intentional silent exception handling
    "B112",  # try_except_continue - Intentional defensive loop handling
    "B311",  # random - Not used for cryptographic purposes
    "B404",  # import_subprocess - Used safely in controlled contexts
    "B603",  # subprocess_without_shell_equals_true - Safe subprocess usage
    "B607",  # start_process_with_partial_path - Chrome driver uses system PATH
]
# Severity threshold
severity = "low"
confidence = "low"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
# const.py and manifest.json are stamped via version_variables. NOTE: const.py's
# INTEGRATION_VERSION carries NO type annotation on purpose -- the version_variables
# regex only matches `NAME = "x"`, not `NAME: str = "x"` (a word token between the
# name and `=` breaks the match). Do not re-add the annotation.
version_variables = [
    "custom_components/googlefindmy/const.py:INTEGRATION_VERSION",
    "custom_components/googlefindmy/manifest.json:version",
]
# Release from any X.Y maintenance line (or main); no hard-wired branch name. The
# version comes from the last matching git tag (tag_format) plus the Conventional
# Commits since it, never from the branch name. tag_format has no `v` prefix, matching
# the recent no-prefix tag convention rather than the ancient `v1.0.x` tags.
tag_format = "{version}"
upload_to_pypi = false
upload_to_release = true
build_command = "poetry build"

[tool.semantic_release.branches.release]
# Matches `main` AND any X.Y maintenance line (1.7, 1.8, ...) without naming one.
match = "^(main|[0-9]+\\.[0-9]+)$"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^ci:",
]

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
