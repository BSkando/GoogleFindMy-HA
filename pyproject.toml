[tool.poetry]
name = "googlefindmy-ha"
# Integration version: coupled triple. MUST be bumped together with
# custom_components/googlefindmy/const.py INTEGRATION_VERSION and
# custom_components/googlefindmy/manifest.json "version" on every release.
# semantic-release keeps all three in sync automatically only on SemVer release
# lines (main), via [tool.semantic_release] version_toml + version_variables
# below. On PEP 440 maintenance lines (X.Y, tagged four-segment `.N` or beta
# `bN`), PSR silently skips the tag scheme (see .github/workflows/release.yml);
# there the maintainer hand-tags and release-stamp.yml stamps the triple via
# script/stamp_version.py, so on those lines the hand-tag/stamp path is primary,
# not a fallback. Canonical anchor:
# custom_components/googlefindmy/AGENTS.md ("Version bump touches three files").
version = "1.15.34"
description = "Home Assistant integration for Google's Find My Device network."
readme = "README.md"
license = "MIT"
authors = ["BSkando"]
homepage = "https://github.com/BSkando/GoogleFindMy-HA"
documentation = "https://github.com/BSkando/GoogleFindMy-HA"
repository = "https://github.com/BSkando/GoogleFindMy-HA"

packages = [
    { include = "custom_components" }
]

[tool.poetry.dependencies]
python = "^3.14.2"
aiohttp = ">=3.11.8"
beautifulsoup4 = ">=4.12.3"
cryptography = ">=43.0.3"
ecdsa = ">=0.19.2"
gpsoauth = ">=2.0.0"
grpclib = ">=0.4.7"
h2 = ">=4.1.0"
http-ece = ">=1.2.1"
httpx = { version = ">=0.28.0", extras = ["http2"] }
protobuf = ">=6.31.1"
pycryptodomex = ">=3.23.0"
pyscrypt = ">=1.6.2"
selenium = ">=4.25.0"
undetected-chromedriver = ">=3.5.5"

[tool.poetry.group.dev.dependencies]
# Linting & Formatting
ruff = ">=0.14.1"
mypy = ">=1.11"
bandit = { version = ">=1.7.10", extras = ["toml"] }
pre-commit = ">=3.7"
codespell = ">=2.2.6"

# Type stubs
types-requests = ">=2.32.0.20240712"
types-cffi = ">=1.17.0"
types-html5lib = ">=1.1.11"
types-PySocks = ">=1.7.1"
lxml-stubs = ">=0.5.1"

# Security auditing
pip-audit = ">=2.6"

# Additional dev tools
pyyaml = ">=6.0.2"
pycares = ">=4.4.0"
certifi = ">=2024.7.4"

# Release automation
python-semantic-release = ">=9.0.0"
pytest-homeassistant-custom-component = "^0.13.306"

[tool.poetry.group.test.dependencies]
# Core testing framework
pytest = ">=8.3"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=5.0"
pytest-socket = ">=0.7.0"
pytest-xdist = ">=3.5.0"
hypothesis = ">=6.100.0"
# GitHub's Markdown parser, used by the DocToc pre-commit hook and its tests
cmarkgfm = ">=2025.10.22"

# Home Assistant testing - ALWAYS use latest version (no upper bound)
# This ensures we test against the latest HA compatibility
# NOTE: Minimum supported HA core is 2025.9.1, the empirical dependency floor
# (see script/check_ha_compatibility.py --find-minimum). ConfigSubentryFlow first
# shipped in 2025.8, but bundled dependencies raise the effective minimum to 2025.9.1.
pytest-homeassistant-custom-component = ">=0.13"
homeassistant = ">=2025.9.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
extend-exclude = [
    "custom_components/googlefindmy/ProtoDecoders",
    "custom_components/googlefindmy/Auth/firebase_messaging/proto",
