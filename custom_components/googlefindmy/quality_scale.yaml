    - id: integration-owner
      status: done
      evidence:
        - "custom_components/googlefindmy/manifest.json:codeowners"
    - id: log-when-unavailable
      status: done
      evidence:
        - "custom_components/googlefindmy/coordinator/polling.py:PollingOperations._note_fcm_deferral"
        - "custom_components/googlefindmy/coordinator/polling.py:PollingOperations._note_empty_location_result"
    - id: parallel-updates
      status: done
      evidence:
        - "custom_components/googlefindmy/binary_sensor.py:PARALLEL_UPDATES"
        - "custom_components/googlefindmy/button.py:PARALLEL_UPDATES"
        - "custom_components/googlefindmy/device_tracker.py:PARALLEL_UPDATES"
        - "custom_components/googlefindmy/sensor.py:PARALLEL_UPDATES"
    - id: reauthentication-flow
      status: done
      evidence:
        - "custom_components/googlefindmy/config_flow.py:ConfigFlow.async_step_reauth_confirm"
        - "tests/test_reauth_manual_token.py:test_manual_reauth_clears_cached_aas_and_mints_new_token"
    - id: test-coverage
      # Tier-downgrade: scoped coverage on custom_components/googlefindmy
      # measured 63.59 % (PR #1072 registry/subentry helpers, was 64 % in
      # PR #1071). Platinum requires >= 95 %. A sprint floor of 63 % is
      # wired in both gates (pyproject.toml fail_under, ci.yml
      # --cov-fail-under, tests/test_platinum_compliance.py::
      # test_coverage_threshold_enforced enforces gate-agreement) and will
      # be raised stepwise (63 -> 70 -> 80 -> 90 -> 95) as tests expand.
      # Revert to `done` once the 95 % floor lands.
      status: todo
      evidence:
        - "pyproject.toml:[tool.coverage.report]:fail_under"
        - ".github/workflows/ci.yml:--cov-fail-under"
        - "tests/test_platinum_compliance.py:test_coverage_threshold_enforced"

