# quality_scale.yaml – Tracking the Integration Quality Scale rules (for hassfest & review)
# The rule IDs below match the official Developer Docs:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/
# Evidence entries use the format "path.py:symbol" (or "tests/test_module.py:test_case")
# so future updates can jump straight to the implementation or regression test.
#
# Tier downshift (Codex-Review 2026-06-04, Commit 7dab5450):
# HA Quality Scale requires ALL rules of the declared tier and ALL lower
# tiers to be `done` with no exceptions. `test-coverage` is a Silver rule
# (>=95 % scoped coverage); during the coverage sprint it is held at `todo`
# (measured 64 %, sprint floor 60 %). Because Silver is therefore not
# fulfilled, the declared tier must be Bronze until scoped coverage reaches
# 95 % and `test-coverage` flips to `done`.
# Phase-tier-hike plan: see PLAN_CI_WARNINGS_NODE24_PLACEHOLDER.md
# (Bronze now -> Silver at >=95 % -> Gold-audit -> Platinum-audit).

tier: bronze

# Replace with the upstream maintainer handle from which your fork originated.
owner: "@BSkando"

rules:
  bronze:
    - id: action-setup
      status: done
      evidence:
        - "custom_components/googlefindmy/__init__.py:async_setup_entry"
        - "custom_components/googlefindmy/services.py:_async_authorize_device_call"
        - "tests/test_services_permissions.py:test_read_only_user_is_rejected"
    - id: appropriate-polling
      status: done
      evidence:
        - "custom_components/googlefindmy/coordinator/main.py:GoogleFindMyCoordinator.__init__"
        - "custom_components/googlefindmy/coordinator/polling.py:PollingOperations._async_update_data"
    - id: brands
      status: done
      evidence:
        - "custom_components/googlefindmy/brand/icon.png"
        - "custom_components/googlefindmy/icons.json"
    - id: common-modules
      status: done
      evidence:
