syntax = "proto3";

message Time {
    uint32 seconds = 1;
    uint32 nanos = 2;
}

message LocationReport {
  SemanticLocation semanticLocation = 5;
  GeoLocation geoLocation = 10;
  Status status = 11;
}

message SemanticLocation {
  string locationName = 1;
  int32 status = 5; // Spot@55f87f62
  bytes semanticLocationIdentifier = 7; // Spot@55f87f62 form: SemanticLocation.SemanticLocationIdentifier

  // Spot@55f87f62, reverse-engineered, not confirmed by Google.
  message SemanticLocationIdentifier {
    string uuid = 2;
  }
}

enum Status {
  SEMANTIC = 0;
  LAST_KNOWN = 1;
  // Finders contributing "with network in all areas" (Contribution Settings: All Areas).
  CROWDSOURCED = 2;
  // Finders contributing "with network in high-traffic areas only" (Contribution Settings: High Traffic Only).
  AGGREGATED = 3;
}

message GeoLocation {
  EncryptedReport encryptedReport = 1;
  uint32 deviceTimeOffset = 2;
  float accuracy = 3;
}

message EncryptedReport {
    bytes publicKeyRandom = 1;
    bytes encryptedLocation = 2;
    bool isOwnReport = 3;
}

message GetEidInfoForE2eeDevicesRequest {
    int32 ownerKeyVersion = 1;
    bool hasOwnerKeyVersion = 2;
}
