# Hooks run from the project environment (`poetry run pre-commit run --all-files`)
# and in CI. The revs of ruff, codespell and bandit follow poetry.lock;
# tests/test_precommit_config_contract.py fails when they drift apart.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --exit-non-zero-on-fix
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Same scope as the `skip` in pyproject.toml, which codespell does not
        # apply to file names passed on the command line.
        exclude: ^(custom_components/googlefindmy/(translations|vendor/leaflet)/|tests/fixtures/)

  - repo: local
    hooks:
      # mypy and pytest run from the project environment: `repo: local` has no
      # project to install, so `.[dev]` never reached them. Activate the
      # environment first (`poetry run pre-commit ...`); a missing tool fails
      # the hook instead of passing it.
      - id: mypy
        name: mypy
        entry: mypy --strict -p custom_components.googlefindmy -p tests
        language: system
        pass_filenames: false
        types: [python]
        require_serial: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      # Scan the same tree as the CI bandit job (`-r custom_components`);
      # without this, pre-commit appends every Python file of the repository.
      - id: bandit
        pass_filenames: false
        args:
          - -ll
          - -c
          - bandit.yaml
          - -r
          - custom_components
        additional_dependencies:
          - bandit[toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The vendored Leaflet copy is checked against a recorded digest; leave
      # it byte-identical. Two trailing spaces in Markdown are line breaks.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^custom_components/googlefindmy/vendor/leaflet/
      - id: end-of-file-fixer
        exclude: ^custom_components/googlefindmy/vendor/leaflet/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: doctoc
        name: doctoc
        entry: python script/precommit_hooks/update_doctoc.py
        language: python
        additional_dependencies:
          - cmarkgfm>=2025.10.22
        files: ^AGENTS\.md$

      - id: translations-sync-check
        name: Ensure translations are up to date
        entry: python script/sync_translations.py --check
        language: python
        pass_filenames: false
        always_run: true

      - id: translation-placeholder-check
        name: Ensure issue translation placeholders match code
        entry: python script/translation_placeholder_check.py
        language: python
        pass_filenames: false
        always_run: true

      - id: clean-pycache
        name: Remove Python cache artifacts
        entry: python script/clean_pycache.py
        args:
          - --quiet
        language: python
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest with coverage
        entry: pytest --cov -q
        language: system
        pass_filenames: false
        always_run: true
